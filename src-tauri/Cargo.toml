[package]
name = "breathing-room"
version = "0.1.0-preview.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bucabay/breathing-room-app"

[lib]
name = "breathing_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-notification", "dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-notification = { version = "2.6", optional = true }
tauri-plugin-updater = { version = "2.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"
base64 = "0.22"
rusqlite = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"

[build-dependencies]
base64 = "0.22"
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
minisign-verify = "0.3"
